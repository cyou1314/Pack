name: Pack CI

on:
  push:
    branches: ["main", "codex/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hub:
    name: Hub / regression
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install CI dependencies
        run: python -m pip install --disable-pip-version-check -r hub/requirements-ci.txt
      - name: Shell syntax
        run: |
          bash -n hub/backup-db.sh
          bash -n hub/verify-backup.sh
          bash -n hub/preflight.sh
          bash -n hub/test_backup.sh
          bash -n hub/install-services.sh
          bash -n run-all-suites.sh
          bash -n installer/build-dmg.sh
          bash -n app/make-bundle.sh
          bash -n local/install-local.sh
          bash -n local/uninstall-local.sh
      - name: Python compile
        run: python -m compileall -q hub installer tests
      - name: Unit tests
        run: |
          bash hub/test_backup.sh
          python hub/test_reply_watcher.py
          python hub/test_resolve_mention.py
          python hub/test_systemd_units.py
          python installer/test_launch_agent_safety.py
          python installer/test_dmg_manifest.py
          python hub/test_policy.py
          python hub/test_storage.py
          python hub/test_rooms.py
          python hub/test_context.py
          python hub/test_rooms_service.py
          python hub/test_members_service.py
          python hub/test_packaging.py
          python hub/test_policy_helpers.py
      - name: Verify MCP and SQLite contract snapshots
        run: python hub/export_contracts.py --check
      - name: Default staging regression
        run: PY=python ./run-all-suites.sh

  runtime:
    name: Runtime / syntax and contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Node syntax
        shell: bash
        run: |
          find runtime -type f \( -name "*.mjs" -o -name "*.js" -o -name "*.cjs" \) -print0 | while IFS= read -r -d '' f; do
            node --check "$f"
          done
      - name: Runtime unit tests
        run: node --test runtime/tests/*.test.mjs runtime/l2-handoff/engine.test.cjs

  app:
    name: macOS App / build
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Swift build
        run: swift build --package-path app
      - name: Swift unit tests
        run: swift test --package-path app
      - name: Build and verify app bundle
        run: |
          bash app/make-bundle.sh "$RUNNER_TEMP/Pack.app"
          plutil -lint "$RUNNER_TEMP/Pack.app/Contents/Info.plist"
          codesign --verify --deep --strict "$RUNNER_TEMP/Pack.app"
