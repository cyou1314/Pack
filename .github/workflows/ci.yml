name: Pack CI

on:
  push:
    branches: ["main", "codex/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hub:
    name: Hub / regression
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Set up Node for cross-runtime recovery
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install CI dependencies
        run: python -m pip install --disable-pip-version-check -r hub/requirements-ci.txt
      - name: Shell syntax
        run: |
          bash -n hub/backup-db.sh
          bash -n hub/verify-backup.sh
          bash -n hub/preflight.sh
          bash -n hub/test_backup.sh
          bash -n hub/install-services.sh
          bash -n run-all-suites.sh
          bash -n tests/hub-staging56/run_tests.sh
          bash -n installer/build-dmg.sh
          bash -n app/make-bundle.sh
          bash -n app/make-browser-dev-bundle.sh
          bash -n app/test-make-bundle.sh
      - name: Python compile
        run: |
          python -m compileall -q hub tests
          python -m py_compile installer/manager.py installer/test_manager_paths.py
      - name: Unit tests
        run: |
          bash hub/test_backup.sh
          python hub/test_reply_watcher.py
          python hub/test_resolve_mention.py
          python hub/test_db_query_indexes.py
          python hub/test_task_lifecycle_guards.py
          python hub/test_collaboration_policy.py
          python hub/test_collaboration_store.py
          python hub/test_collaboration_dispatch.py
          python hub/test_collaboration_guard.py
          python hub/test_collaboration_context.py
          python hub/test_collaboration_hub.py
          python hub/test_collaboration_migrate.py
          python hub/test_collaboration_identity_inventory.py
          python hub/test_collaboration_connection_binding.py
          python hub/test_registry_v1_port.py
          python hub/test_registry_v2_v3_port.py
          python hub/test_registry_event_v4_v5_port.py
          python hub/test_agent_event_auth_port.py
          python hub/test_agent_event_inbox_port.py
          python hub/test_agent_event_gateway_boundary.py
          python hub/test_agent_event_consumers_port.py
          python hub/test_registry_session_v7_port.py
          python hub/test_agent_sessions_port.py
          python hub/test_agent_session_projector_port.py
          python hub/test_event_recovery_e2e.py
          python hub/test_registry_offline_chain.py
          python hub/test_agent_registry_shadow_port.py
          python hub/test_registry_rehearsal.py
          python hub/test_registry_binding_migration.py
          python hub/test_agent_execution_control.py
          python installer/test_manager_paths.py
          python installer/test_engine_lock.py
          python installer/test_browser_payload.py
          python -m py_compile runtime/l2-handoff/prepare-electron.py runtime/l2-handoff/verify-electron.py runtime/l2-handoff/test_prepare_electron.py runtime/l2-handoff/test_verify_electron.py
          python runtime/l2-handoff/test_prepare_electron.py
          python runtime/l2-handoff/test_verify_electron.py
          bash app/test-make-bundle.sh
      - name: Default staging regression
        run: PY=python ./run-all-suites.sh

      - name: Staging56 access-mode and migration regression
        run: PY=python ./tests/hub-staging56/run_tests.sh

  runtime:
    name: Runtime / tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Node syntax
        shell: bash
        run: |
          find runtime -type f \( -name "*.mjs" -o -name "*.js" -o -name "*.cjs" \) -print0 | while IFS= read -r -d '' f; do
            node --check "$f"
          done
      - name: Runtime unit tests
        run: node --test runtime/tests/*.test.mjs runtime/muse4ai-bridge/tests/*.test.mjs runtime/l2-handoff/*.test.cjs runtime/browser-driver/sessions.test.mjs runtime/browser-driver/native-login.test.mjs

  app:
    name: macOS App / build
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Hub CI dependencies
        run: python -m pip install --disable-pip-version-check -r hub/requirements-ci.txt
      - name: Hub SQLite migration and query-plan smoke
        run: python hub/test_db_query_indexes.py
      - name: Installer transaction and Hub payload regression
        run: python installer/test_manager_paths.py
      - name: Engine payload lock regression
        run: python installer/test_engine_lock.py
      - name: App bundle output path safety
        run: bash app/test-make-bundle.sh
      - name: Swift unit tests
        run: swift test --package-path app
      - name: Swift app bundle build
        run: |
          STAGE="$(mktemp -d "${TMPDIR:-/tmp}/pack-app-ci.XXXXXX")"
          trap 'rm -rf "$STAGE"' EXIT
          bash app/make-bundle.sh "$STAGE/Pack.app"
          test -x "$STAGE/Pack.app/Contents/MacOS/PackApp"

  browser:
    name: Browser / Chromium isolation
    runs-on: macos-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: runtime/browser-driver
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate checked-in dependency lock
        run: node verify-candidate-lock.mjs
      - name: Install exact checked-in lock
        run: npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
      - name: Set up manifest Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install matching Chromium into dedicated CI cache
        run: PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/pack-browser-cache" node node_modules/playwright-core/cli.js install chromium
      - name: Local browser isolation smoke
        run: PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/pack-browser-cache" node --test chromium.smoke.mjs chatgpt-page-driver.smoke.mjs
      - name: Build and verify relocated browser candidate
        run: |
          PAYLOAD="$RUNNER_TEMP/pack-browser-payload"
          LOCK="$RUNNER_TEMP/browser-payload.candidate.json"
          bash ../../installer/stage-browser-candidate.sh "$PAYLOAD" "$RUNNER_TEMP/pack-browser-cache" "$(command -v node)"
          python ../../installer/browser-payload.py create --payload "$PAYLOAD" --lock "$LOCK" --revision "$(git rev-parse HEAD)" --architecture "$(uname -m)"
          python ../../installer/browser-payload.py verify --payload "$PAYLOAD" --lock "$LOCK" --revision "$(git rev-parse HEAD)" --architecture "$(uname -m)"
          SMOKE_HOME="$(mktemp -d)"
          (
            cd "$PAYLOAD/runtime/browser-driver"
            env -i HOME="$SMOKE_HOME" PATH=/usr/bin:/bin PLAYWRIGHT_BROWSERS_PATH="$PAYLOAD/browsers" "$PAYLOAD/node/bin/node" --input-type=module -e 'import {createBrowserSessions} from "./playwright.mjs"; import fs from "node:fs/promises"; import path from "node:path"; const root=await fs.mkdtemp(path.join(process.env.HOME,"profile-")); const profile={id:"11111111-1111-4111-8111-111111111111",mode:"nativeAccount"}; const sessions=await createBrowserSessions({root,headless:true}); const context=await sessions.open(profile); try {const page=context.pages()[0]||await context.newPage(); await page.goto("data:text/html,<title>Pack relocation fixture</title>"); if(await page.title()!=="Pack relocation fixture")throw Error("relocation smoke failed");} finally {await sessions.close(profile);}'
          )
          python ../../installer/browser-payload.py verify --payload "$PAYLOAD" --lock "$LOCK" --revision "$(git rev-parse HEAD)" --architecture "$(uname -m)"
      - name: Preserve candidate manifest for review
        uses: actions/upload-artifact@v4
        with:
          name: browser-payload-candidate-manifest
          path: ${{ runner.temp }}/browser-payload.candidate.json
          if-no-files-found: error
