name: Pack CI

on:
  push:
    branches: ["main", "codex/**"]
  pull_request:
    branches: ["main", "codex/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hub:
    name: Hub / regression
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install CI dependencies
        run: python -m pip install --disable-pip-version-check -r hub/requirements-ci.txt
      - name: Shell syntax
        run: |
          bash -n hub/backup-db.sh
          bash -n hub/verify-backup.sh
          bash -n hub/preflight.sh
          bash -n hub/test_backup.sh
          bash -n hub/install-services.sh
          bash -n run-all-suites.sh
          bash -n tests/archive/hub-staging56/run_tests.sh
          bash -n installer/build-dmg.sh
          bash -n installer/upgrade.command
          bash -n installer/mac-inventory.sh
          bash -n app/make-bundle.sh
          bash -n app/test-make-bundle.sh
          bash -n local/install-local.sh
          bash -n local/uninstall-local.sh
      - name: Python compile
        run: python -m compileall -q hub installer tests
      - name: Unit tests
        run: |
          bash hub/test_backup.sh
          python hub/test_reply_watcher.py
          python hub/test_resolve_mention.py
          python hub/test_systemd_units.py
          python installer/test_launch_agent_safety.py
          python installer/test_manager_paths.py
          python installer/test_upgrade_safety.py
          python installer/test_dmg_manifest.py
          python hub/test_policy.py
          python hub/test_storage.py
          python hub/test_agent_registry_migration.py
          python hub/test_agent_event_inbox.py
          python hub/test_agent_event_auth.py
          python hub/test_structured_task_audit.py
          python hub/test_agent_registry_shadow.py
          PYTHONPATH=hub python -m services.agent_registry_shadow --help >/dev/null
          python hub/test_rooms.py
          python hub/test_context.py
          python hub/test_rooms_service.py
          python hub/test_members_service.py
          python hub/test_members_write.py
          python hub/test_tasks_service.py
          python hub/test_task_query_indexes.py
          python hub/test_tasks_write.py
          python hub/test_task_claim.py
          python hub/test_task_update.py
          python hub/test_task_complete.py
          python hub/test_task_block.py
          python hub/test_task_review_cancel.py
          python hub/test_task_transfer.py
          python hub/test_task_transfer_expiry.py
          python hub/test_task_backoff.py
          python hub/test_run_lifecycle.py
          python hub/test_lease_reaper.py
          python hub/test_unclaimed_sweeper.py
          python hub/test_message_mutations.py
          python hub/test_room_post_service.py
          python hub/test_inbox_atomic.py
          python hub/test_inbox_read.py
          python hub/test_attachment_read.py
          python hub/test_attachment_upload.py
          python hub/test_attachment_audit.py
          python hub/test_rules_service.py
          python hub/test_egress_check_service.py
          python hub/test_reviews_service.py
          python hub/test_memory_read_service.py
          python hub/test_memory_write_service.py
          python hub/test_memory_rollback_service.py
          python hub/test_skills_service.py
          python hub/test_desktop_service.py
          python hub/test_templates_service.py
          python hub/test_member_registration_service.py
          python hub/test_member_avatar_service.py
          python hub/test_pairing_service.py
          python hub/test_runs_service.py
          python hub/test_packaging.py
          bash app/test-make-bundle.sh
          python hub/test_policy_helpers.py
      - name: Diagnose exact SQLite contract snapshot differences
        run: |
          python hub/export_contracts.py --write
          git diff -- hub/contracts/sqlite-fresh.json hub/contracts/sqlite-legacy-migrated.json
      - name: Verify MCP and SQLite contract snapshots
        run: python hub/export_contracts.py --check
      - name: Default staging regression
        run: PY=python ./run-all-suites.sh
      - name: Staging56 access-mode and migration regression
        run: PY=python ./tests/archive/hub-staging56/run_tests.sh

  runtime:
    name: Runtime / syntax and contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Node syntax
        shell: bash
        run: |
          find runtime -type f \( -name "*.mjs" -o -name "*.js" -o -name "*.cjs" \) -print0 | while IFS= read -r -d '' f; do
            node --check "$f"
          done
      - name: Runtime unit tests
        run: node --test runtime/tests/*.test.mjs runtime/l2-handoff/engine.test.cjs

  app:
    name: macOS App / build
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python for installer tests
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Installer regression on macOS
        run: |
          bash -n installer/mac-inventory.sh
          bash installer/mac-inventory.sh "$RUNNER_TEMP/pack-inventory.txt"
          test -s "$RUNNER_TEMP/pack-inventory.txt"
          grep -q "Keychain=not queried" "$RUNNER_TEMP/pack-inventory.txt"
          python installer/test_launch_agent_safety.py
          python installer/test_upgrade_safety.py
          python installer/test_dmg_manifest.py
      - name: Swift build
        run: swift build --package-path app
      - name: Swift release build
        run: swift build -c release --package-path app
      - name: Swift unit tests
        run: swift test --package-path app
      - name: Build and verify release app bundle
        run: |
          PACK_BUILD_CONFIGURATION=release bash app/make-bundle.sh "$RUNNER_TEMP/Pack.app"
          plutil -lint "$RUNNER_TEMP/Pack.app/Contents/Info.plist"
          codesign --verify --deep --strict "$RUNNER_TEMP/Pack.app"
