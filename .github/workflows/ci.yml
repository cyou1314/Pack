name: Pack CI

on:
  push:
    branches: ["main", "codex/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hub:
    name: Hub / regression
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install CI dependencies
        run: python -m pip install --disable-pip-version-check -r hub/requirements-ci.txt
      - name: Shell syntax
        run: |
          bash -n hub/backup-db.sh
          bash -n hub/verify-backup.sh
          bash -n hub/preflight.sh
          bash -n hub/install-services.sh
          bash -n run-all-suites.sh
      - name: Python compile
        run: python -m compileall -q hub hub-staging38 hub-staging39 hub-staging40 hub-staging41 hub-staging42 hub-staging43 hub-staging44 hub-staging45 hub-staging46
      - name: Unit tests
        run: |
          python hub/test_reply_watcher.py
          python hub-staging41/test_w4_handler.py
          python hub-staging44/test_w5_template.py
      - name: Full current staging regression
        run: ./run-all-suites.sh

  runtime:
    name: Runtime / syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Node syntax
        shell: bash
        run: |
          find runtime -type f \( -name "*.mjs" -o -name "*.js" \) -print0 | while IFS= read -r -d '' f; do
            node --check "$f"
          done

  app:
    name: macOS App / build
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Swift build
        run: swift build --package-path app
